name: dandpak_core
description: Lõi dùng chung cho 3 app Dan-D Pak (desktop/tablet/phone) — models, providers, screens, services, ui, widgets + điểm vào khởi động.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

# Gói này chứa toàn bộ code UI + nghiệp vụ dùng chung nên phụ thuộc Flutter và
# mọi plugin mà các màn hình/services cần. Ba app chỉ cần depend `dandpak_core`
# — plugin được kéo vào theo phụ thuộc bắc cầu, không cần khai lại ở từng app.
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.0
  socket_io_client: ^2.0.3
  # Âm báo thông báo (.ogg) phát trong app — libmpv (media_kit) giải mã Ogg/Vorbis.
  media_kit: ^1.1.10
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.6
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  # Lưu bền preferences trên Android/iOS (server_url, token…).
  path_provider: ^2.1.5
  # Quét mã vạch/QR bằng camera (ML Kit/AVFoundation) — không có bản Windows,
  # desktop tự bỏ qua.
  # Production pin: nâng phiên bản chỉ sau canary camera trên thiết bị thật.
  mobile_scanner: 6.0.11
  # Win32 (FFI) cho kiosk màn hình phụ desktop.
  ffi: ^2.1.0
  video_player: ^2.11.1
  video_player_win: ^3.2.2
  local_notifier: ^0.1.6
  # Chọn/chụp ảnh trên tablet/điện thoại; desktop dùng hộp thoại OS.
  image_picker: ^1.1.2
  # Mở/chia sẻ file xuất qua khay chia sẻ hệ điều hành trên mobile.
  share_plus: ^10.1.4
  # Chọn file dữ liệu (.xlsx) + hộp thoại lưu file mẫu — Kho: import Excel.
  # (>=10: compileSdk 36, khớp flutter_plugin_android_lifecycle mới.)
  file_picker: ^10.0.0
  # Đọc/ghi file Excel .xlsx thuần Dart (file mẫu kiểm kho/nhập/xuất hàng).
  excel: ^4.0.6
  # Sửa tương thích các file Excel hợp lệ do Microsoft Excel tạo nhưng có
  # custom number-format dùng ID built-in (<164) trước khi đưa vào excel parser.
  archive: ^3.6.1
  # Đẩy thông báo KỂ CẢ KHI APP ĐÃ TẮT (Firebase Cloud Messaging) — chỉ thật
  # sự hoạt động trên Android (cần google-services.json ở app tablet/phone);
  # desktop tự bỏ qua (Platform.isAndroid check ở nơi gọi), không cần cấu hình gì thêm.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # In thủ công cho kế toán: dựng tài liệu PDF dạng vector và mở hộp thoại in
  # của hệ điều hành. Luồng này tách biệt hoàn toàn với máy in nhiệt POS.
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Chỉ bundle ảnh UI nhỏ mà code lõi gọi bằng Image.asset. Ảnh sản phẩm, trang
  # menu-book và âm báo được engine Node phục vụ lúc chạy (Image.network/media_kit).
  # Khai Ở ĐÂY (không phải từng app) vì mọi Image.asset()/rootBundle.loadString()
  # tham chiếu các asset này đều nằm trong code dandpak_core — Flutter tự gói
  # asset của package theo package khai báo, app dùng package không cần khai lại.
  assets:
    - assets/brand/DanOnLogo.png
    - assets/brand/logo.png
    - assets/brand/MISA.jpg
    - assets/brand/payoslogo.png
    - assets/brand/vietqr.png
    - assets/brand/sepay.webp
    - assets/brand/Casso.png
    - assets/brand/grabmerchantlogo.webp
    - assets/brand/grabmartlogo.png
    - assets/brand/shopeefoodlogo.png
    - assets/brand/befoodlogo.png
    - assets/brand/Haravan.png
    - assets/brand/shopee.png
    - assets/brand/tiktok.png
    - assets/brand/Lazada.png
    - assets/brand/Facebook_Logo.png
    - assets/brand/Instagram_Glyph_Gradient.png
    - assets/brand/Zalo_logo.png
    - assets/brand/sounds/notifications/catalog.json
    - assets/data/vn_admin_units_2026.json
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
