name: dandpak_desktop
description: "Dan-D Pak Desktop POS Application."
publish_to: 'none'
# Public/updater release name: 2026.09.22.01 (see lib/app_version.dart).
# Pub accepts SemVer's three numeric components only.
version: 2026.9.22+213

environment:
  sdk: '>=3.3.0 <4.0.0'

# Vỏ mỏng: mọi code + plugin đến từ dandpak_core (phụ thuộc bắc cầu). Asset/font
# mà code lõi tham chiếu cũng khai ở dandpak_core (package tự gói khi app dùng
# nó), app không cần khai lại.
dependencies:
  flutter:
    sdk: flutter
  dandpak_core:
    path: ../dandpak_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
