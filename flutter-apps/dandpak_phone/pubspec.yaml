name: dandpak_phone
description: "Dan-D Pak Phone POS Application."
publish_to: 'none'
# Public/updater release name: 2026.09.18.01 (see lib/app_version.dart).
# Pub accepts SemVer's three numeric components only.
version: 2026.9.24+119

environment:
  sdk: '>=3.3.0 <4.0.0'

# Vỏ mỏng: mọi code + plugin đến từ dandpak_core (phụ thuộc bắc cầu). Asset/font
# mà code lõi tham chiếu cũng khai ở dandpak_core (package tự gói khi app dùng
# nó), app không cần khai lại.
dependencies:
  flutter:
    sdk: flutter
  dandpak_core:
    path: ../dandpak_core
  sunmi_printer_plus: ^4.1.1
  # auth_token vao Keystore/Keychain (mã hoá phần cứng) — CHỈ thêm ở app
  # mobile (tablet/phone), không phải dandpak_core: bản Windows của gói này
  # cần component ATL riêng của Visual Studio mà desktop không cài, và desktop
  # cũng không cần vì đã tự xoá token khi đóng cửa sổ. Xem main.dart.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
