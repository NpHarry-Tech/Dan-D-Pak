org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Build Android trên Windows khi pub-cache nằm ổ C: còn dự án ổ D: thì
# build-tools-api của Kotlin không đóng nổi cache tăng dần, báo
# "Could not close incremental caches in …\caches-jvm\jvm\kotlin" và fail
# ngẫu nhiên ở file_picker / share_plus / mobile_scanner. Bản tablet đã phải
# tắt từ trước vì đúng lỗi này; bản phone thiếu dòng đây nên build hỏng còn
# tablet thì không. Tắt biên dịch tăng dần = build lâu hơn nhưng chạy được.
kotlin.incremental=false
