services:
  app:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_ENV: review
      DEPLOYMENT_TARGET: vps
      DISABLE_DEMO_SEED: "false"
      ALLOW_PRODUCTION_DATA: "false"
      SHOPEE_ENV: sandbox
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - review_app_sqlite:/app/server-data
      - review_app_storage:/app/storage
      - review_app_uploads:/app/server/uploads
      - review_app_product_images:/app/server/assets/product-images
    expose:
      - "3000"
    networks:
      dandpak-ingress:
        aliases:
          - review-api
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./portal-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      dandpak-ingress:
        aliases:
          - review-portal

networks:
  dandpak-ingress:
    external: true
    name: dandpak-ingress

volumes:
  review_app_sqlite:
  review_app_storage:
  review_app_uploads:
  review_app_product_images:
