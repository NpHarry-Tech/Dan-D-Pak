# Review portal (static) — security-hardened nginx server block.
# Mounted read-only into nginx:1.27-alpine at /etc/nginx/conf.d/default.conf.
# TLS/HSTS are handled by the TLS-terminating ingress (Caddy on dandpak-ingress);
# this layer sets content-level security headers that apply regardless of proxy.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;              # no nginx version leakage
    autoindex off;                  # no directory listing
    charset utf-8;

    # Security headers for a static, script-free page.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), interest-cohort=()" always;

    # Installer download: force attachment + correct type; deny traversal by exact match.
    location = /download/DanDPak-Review-Setup.exe {
        types { } default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="DanDPak-Review-Setup.exe"' always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Do not serve dotfiles.
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
