services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DEPLOYMENT_TARGET: vps
      DISABLE_DEMO_SEED: "true"
    volumes:
      # SQLite database — dữ liệu bền vững, không mất khi update
      - app_sqlite:/app/server-data
      # File uploads và tài liệu
      - app_storage:/app/storage
      # Permanent JSON archive (thanh toán, đơn hàng...)
      - app_permanent:/app/server/permanent-storage
      # Bản cài auto-update (exe/apk + manifest) — bền vững qua mỗi lần redeploy
      - app_releases:/app/server/releases
      # Uploads runtime (ảnh món, avatar, tài liệu DMS) — TRƯỚC ĐÂY nằm trong
      # container nên mỗi lần rebuild là MẤT; giờ bền vững qua volume.
      - app_uploads:/app/server/uploads
      # Ảnh SKU KiotViet (521MB, gitignore nên không nằm trong image) — seed
      # một lần bằng: docker compose cp <thư-mục-ảnh>/. app:/app/server/assets/product-images/
      - app_product_images:/app/server/assets/product-images
      # Bản sao lưu DB mã hóa (backups/) — TRƯỚC ĐÂY không có volume nên MỖI
      # LẦN rebuild container (deploy code mới) là mất sạch toàn bộ lịch sử sao
      # lưu, dù DB thật vẫn an toàn (app_sqlite). Phát hiện khi kiểm tra lại sự
      # cố 2026-07-27 — rebuild xong, guard "đã sao lưu hôm nay" không thấy file
      # cũ nào vì thư mục vừa bị xóa sạch, nên lại chạy sao lưu lại từ đầu.
      - app_backups:/app/backups
    # Mở 3000 trực tiếp bên cạnh Caddy:80 — app POS/tablet nhập IP trần sẽ tự
    # nối cổng 3000 (mặc định của máy chủ LAN) nên phải cho vào được.
    expose:
      - "3000"
    # Giới hạn cứng để 1 lỗi (rò rỉ bộ nhớ, vòng lặp CPU do bug) không kéo sập
    # cả VPS 2GB (kernel OOM-kill lung tung, cả Caddy lẫn app) — container vượt
    # ngưỡng bị Docker restart SẠCH (restart: unless-stopped ở trên tự hồi phục)
    # thay vì cả máy bị treo. ulimit nofile đề phòng rò rỉ file descriptor.
    deploy:
      resources:
        limits:
          memory: 1536M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  app_sqlite:
  app_storage:
  app_permanent:
  app_releases:
  app_uploads:
  app_product_images:
  app_backups:
